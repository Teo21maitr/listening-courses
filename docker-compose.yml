services:
  app:
    build: .
    image: pdf-to-audio
    ports:
      - "8000:8000"
    environment:
      MAX_PDF_SIZE_MB: 100
      TEXT_CHUNK_MAX_CHARS: 1500
      OUTPUT_AUDIO_BITRATE: 128k
      JOB_TTL_HOURS: 6
      TTS_SPEED: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
